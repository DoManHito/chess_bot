<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neural Network vs Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; margin-top: 30px;}
        #myBoard { width: 450px; margin: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        #status { font-size: 16px; margin-top: 10px; text-align: center; line-height: 1.8; max-width: 600px; background: #2d2d2d; padding: 15px; border-radius: 8px;}
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h2>Move Analysis Comparison</h2>
    <div id="myBoard"></div>
    <div id="status"><b>Your turn (White).</b> Make your first move to start!</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function getStyleForClass(moveClass) {
            let color = "#fff";
            switch(moveClass) {
                case "Best": color = "#00E676"; break;
                case "Excellent": color = "#4CAF50"; break;
                case "Good": color = "#8BC34A"; break;
                case "Inaccuracy": color = "#FFC107"; break;
                case "Mistake": color = "#FF9800"; break;
                case "Blunder": color = "#F44336"; break;
            }
            return 'style="color: ' + color + '; font-weight: bold;"';
        }

        function formatFeedback(movePrefix, san, nnClass, idealClass) {
            return movePrefix + " <b>" + san + "</b><br>" +
                   "🧠 Network: <span " + getStyleForClass(nnClass) + ">" + nnClass + "</span> | " +
                   "🤖 Ideal (SF): <span " + getStyleForClass(idealClass) + ">" + idealClass + "</span>";
        }

        function makeBotMove(playerFeedbackHtml) {
            if (game.game_over()) return;

            $status.html(playerFeedbackHtml + "<br><span style='color: #aaa;'>Bot is thinking...</span>");

            $.get('http://127.0.0.1:8000/get_move', { fen: game.fen(), simulations: 100 }, function(data) {
                if (data.error) {
                    $status.html('Error: ' + data.error);
                    return;
                }

                game.move({ uci: true, from: data.move_uci.substring(0, 2), to: data.move_uci.substring(2, 4) });
                board.position(game.fen());
                
                if (game.in_checkmate()) {
                    $status.html(playerFeedbackHtml + "<br><b style='color: #F44336;'>CHECKMATE! Bot won. 🤖💀</b>");
                    return;
                } else if (game.game_over()) {
                    $status.html(playerFeedbackHtml + "<br><b>Draw! 🤝</b>");
                    return;
                }

                let botFeedbackHtml = formatFeedback("Bot responded:", data.move_san, data.bot_nn_class, data.bot_ideal_class);
                $status.html(playerFeedbackHtml + "<hr style='border-color:#444;'>" + botFeedbackHtml + "<br><br><b>Your turn!</b>");
            });
        }

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over() || game.turn() === 'b') return false;
        }

        function onDrop(source, target) {
            var fenBeforeMove = game.fen();
            var move = game.move({ from: source, to: target, promotion: 'q' });
            
            if (move === null) return 'snapback';
            board.position(game.fen());

            if (game.in_checkmate()) {
                $status.html("<b style='color: #00E676;'>CHECKMATE! You won! 🎉🏆</b>");
                return;
            } else if (game.game_over()) {
                $status.html("<b>Game ended in a draw! 🤝</b>");
                return;
            }

            $status.html("<span style='color: #aaa;'>Double analysis of your move by engine and network...</span>");
            
            $.get('http://127.0.0.1:8000/analyze_move', { fen: fenBeforeMove, move_san: move.san }, function(data) {
                let playerFeedbackHtml = formatFeedback("You played:", move.san, data.nn_class, data.ideal_class);
                
                window.setTimeout(function() {
                    makeBotMove(playerFeedbackHtml);
                }, 200);
            });
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
