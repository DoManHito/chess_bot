<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play Against MCTS Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; background: #222; color: #fff; }
        #myBoard { width: 400px; margin: 20px; }
        #status { font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Chess Bot (Neural Network + MCTS)</h2>
    <div id="myBoard"></div>
    <div id="status">Your Turn (White)</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function makeBotMove() {
            if (game.game_over()) return;

            $status.html('Bot is thinking...');

            $.get('http://127.0.0.1:8000/get_move', { fen: game.fen() }, function(data) {
                if (data.error) {
                    $status.html('Server error: ' + data.error);
                    return;
                }

                game.move({ uci: true, from: data.move_uci.substring(0, 2), to: data.move_uci.substring(2, 4) });
                board.position(game.fen());
                
                if (game.game_over()) {
                    $status.html('Game over!');
                } else {
                    $status.html('Your turn! Bot played: ' + data.move_san);
                }
            });
        }

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over() || game.turn() === 'b') return false;
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            board.position(game.fen()); 
            window.setTimeout(makeBotMove, 250);
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
