<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шахматный ИИ с оценкой ходов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; background: #222; color: #fff; margin-top: 40px;}
        #myBoard { width: 450px; margin: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #status { font-size: 18px; margin-top: 10px; text-align: center; line-height: 1.6; max-width: 500px;}
    </style>
</head>
<body>

    <h2>Шахматный Бот (MCTS + Классификатор ходов)</h2>
    <div id="myBoard"></div>
    <div id="status">Ваш ход (Белые). Сделайте ход, чтобы активировать оценку ИИ!</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // Вспомогательная функция для подбора цветов оценок (стиль Chess.com)
        function getColorForClass(moveClass) {
            switch(moveClass) {
                case "Best": return "#00E676";       // Ярко-зеленый
                case "Excellent": return "#4CAF50";  // Зеленый
                case "Good": return "#8BC34A";       // Салатовый
                case "Inaccuracy": return "#FFC107"; // Желтый
                case "Mistake": return "#FF9800";    // Оранжевый
                case "Blunder": return "#F44336";    // Красный
                default: return "#fff";
            }
        }

        function makeBotMove(playerFeedbackHtml) {
            if (game.game_over()) return;

            $status.html(playerFeedbackHtml + "<br><span style='color: #aaa;'>Бот рассчитывает варианты...</span>");

            // Запрашиваем ход у ИИ (800 симуляций для глубины)
            $.get('http://127.0.0.1:8000/get_move', { fen: game.fen(), simulations: 800 }, function(data) {
                if (data.error) {
                    $status.html('Ошибка сервера: ' + data.error);
                    return;
                }

                // Выполняем ход бота на доске
                game.move({ uci: true, from: data.move_uci.substring(0, 2), to: data.move_uci.substring(2, 4) });
                board.position(game.fen());
                
                // 1. Проверяем, не поставил ли бот МАТ игроку
                if (game.in_checkmate()) {
                    $status.html(playerFeedbackHtml + "<br><b style='color: #F44336;'>МАТ! Бот победил. 🤖💀</b>");
                    return;
                } else if (game.game_over()) {
                    $status.html(playerFeedbackHtml + "<br><b>Игра завершилась ничьей! 🤝</b>");
                    return;
                }

                // Если игра продолжается, выводим вердикт по обоим ходам
                let botColor = getColorForClass(data.bot_move_class);
                let botFeedbackHtml = "Бот ответил: <b>" + data.move_san + "</b> (<span style='color:" + botColor + "; font-weight:bold;'>" + data.bot_move_class + "</span>)";
                
                $status.html(playerFeedbackHtml + "<br>" + botFeedbackHtml + "<br><br><b>Ваш ход!</b>");
            });
        }

        function onDragStart(source, piece, position, orientation) {
            // Запрещаем ходить, если игра окончена или сейчас ход черных (бота)
            if (game.game_over() || game.turn() === 'b') return false;
        }

        function onDrop(source, target) {
            var fenBeforeMove = game.fen(); // Запоминаем позицию ДО вашего хода для анализа

            // Пытаемся сделать ход во внутренней логике chess.js
            var move = game.move({ from: source, to: target, promotion: 'q' });
            
            // Если ход нелегальный, возвращаем фигуру назад
            if (move === null) return 'snapback';
            
            board.position(game.fen()); // Обновляем графическую доску

            // 2. Проверяем, не поставил ли игрок МАТ боту
            if (game.in_checkmate()) {
                $status.html("<b style='color: #00E676;'>ШАХ И МАТ! Вы победили бота! 🎉🏆</b>");
                return;
            } else if (game.game_over()) {
                $status.html("<b>Игра окончена (Ничья/Пат)! 🤝</b>");
                return;
            }

            // Отправляем ход игрока на бэкенд-анализ
            $status.html("<span style='color: #aaa;'>Нейросеть оценивает ваш ход...</span>");
            
            $.get('http://127.0.0.1:8000/analyze_move', { fen: fenBeforeMove, move_san: move.san }, function(data) {
                let playerColor = getColorForClass(data.move_class);
                let playerFeedbackHtml = "Вы сыграли: <b>" + move.san + "</b> (<span style='color:" + playerColor + "; font-weight:bold;'>" + data.move_class + "</span>).";
                
                // Передаем оценку вашего хода в функцию бота, чтобы склеить логи на экране
                window.setTimeout(function() {
                    makeBotMove(playerFeedbackHtml);
                }, 200);
            });
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
